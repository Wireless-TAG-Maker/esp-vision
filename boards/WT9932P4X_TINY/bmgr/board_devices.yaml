version: 1.0.0
devices:
  - name: camera_power_ctrl
    type: power_ctrl
    sub_type: gpio
    version: default
    init_skip: true
    peripherals:
      - name: gpio_camera_power
        active_level: 1

  - name: display_lcd
    chip: st7102
    type: display_lcd
    sub_type: dsi
    version: default
    init_skip: true
    dependencies:
      kevincoooool/esp_lcd_st7102: "1.0.0"
    config:
      reset_gpio_num: 27
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_LITTLE
      bits_per_pixel: 16
      reset_active_high: 0
      dbi_config:
        virtual_channel: 0
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 24
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 1
        flags:
          use_dma2d: false
          disable_lp: false
        video_timing:
          h_size: 480
          v_size: 640
          hsync_back_porch: 40
          hsync_pulse_width: 2
          hsync_front_porch: 40
          vsync_back_porch: 10
          vsync_pulse_width: 2
          vsync_front_porch: 145
    peripherals:
      - name: ldo_mipi
      - name: dsi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    init_skip: true
    config:
      default_percent: 0
    peripherals:
      - name: ledc_backlight

  - name: lcd_touch
    chip: st7123
    type: lcd_touch
    sub_type: i2c
    version: default
    init_skip: true
    dependencies:
      espressif/esp_lcd_touch_st7123: "1.0.2"
    config:
      io_i2c_config:
        scl_speed_hz: 100000
        control_phase_bytes: 1
        lcd_cmd_bits: 16
        flags:
          disable_control_phase: true
      touch_config:
        x_max: 480
        y_max: 640
        rst_gpio_num: -1
        int_gpio_num: -1
    peripherals:
      - name: i2c_camera
        # Board Manager uses the 8-bit form of the ST7123 7-bit address 0x55.
        i2c_addr: [0xAA]

  - name: camera
    type: camera
    sub_type: csi
    version: default
    init_skip: true
    config:
      csi_config:
        reset_io: -1
        pwdn_io: -1
        dont_init_ldo: true
    peripherals:
      - name: i2c_camera
        frequency: 400000
      - name: ldo_mipi
